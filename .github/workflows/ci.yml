name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs
        run: |
          test -f README.md
          test -f LICENSE
          grep -q "MIT License" LICENSE
          grep -q "everything-mcp-web in LAN" README.md
          grep -q '^PLAN.md$' .gitignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: ${{ hashFiles('gradlew') != '' }}
      - name: Gradle check (when project exists)
        if: ${{ hashFiles('gradlew') != '' }}
        run: bash ./gradlew --no-daemon check
